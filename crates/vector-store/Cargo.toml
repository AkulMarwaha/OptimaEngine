[package]
name = "vector-store"
version = "0.1.0"
edition = "2024"

[dependencies]
lancedb      = "0.29"
arrow-array  = "58"
arrow-schema = "58"
tokio        = { version = "1", features = ["full"] }
reqwest      = { version = "0.12", features = ["json"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
tracing      = "0.1"
polars       = { version = "0.46", features = ["parquet"] }
futures      = "0.3"
